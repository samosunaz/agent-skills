name: Release Please

on:
  push:
    branches:
      - main
  # release-please recomputes from every commit since the last tag, so a manual
  # run recovers a release PR left stale by pushes whose workflow never fired.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
